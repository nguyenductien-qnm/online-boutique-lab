{{- range $path, $_ :=  .Files.Glob "dashboards/*.json" }}
{{- $name := base $path | replace ".json" "" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "dashboard-%s" $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
