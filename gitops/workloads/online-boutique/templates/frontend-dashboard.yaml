apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  frontend-dashboard.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "stat",
          "title": "Success Rate",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(frontend_http_requests_total{status_code!~\"5..\"}[5m])) / sum(rate(frontend_http_requests_total[5m])) * 100",
              "legendFormat": "Success Rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 99 }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Total Request Rate",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 0 },
          "id": 2,
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(frontend_http_requests_total[5m]))",
              "legendFormat": "Requests/sec"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "HTTP Traffic Volume (by Route)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 3,
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(frontend_http_requests_total[5m])) by (route, status_code)",
              "legendFormat": "{{ "{{" }}route{{ "}}" }} ({{ "{{" }}status_code{{ "}}" }})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line"
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Latency Percentiles (p95, p99)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 4,
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(frontend_http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95"
            },
            {
              "datasource": { "type": "prometheus" },
              "expr": "histogram_quantile(0.99, sum(rate(frontend_http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line"
              }
            }
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["frontend", "online-boutique"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "title": "Frontend Service Metrics",
      "uid": "frontend-service-metrics"
    }
