apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
spec:
  selector:
    matchLabels:
      app: emailservice
  template:
    metadata:
      labels:
        app: emailservice
    spec:
      serviceAccountName: online-boutique
      containers:
        - name: server
          image: 730335441285.dkr.ecr.ap-southeast-1.amazonaws.com/online-boutique/emailservice:6dbead2cda359b8d3b85d7628ddc28f7414bde57-30780838023
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DISABLE_PROFILER
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
spec:
  selector:
    app: emailservice
  ports:
    - port: 5000
      targetPort: 8080