apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
spec:
  selector:
    matchLabels:
      app: shippingservice
  template:
    metadata:
      labels:
        app: shippingservice
    spec:
      serviceAccountName: online-boutique
      containers:
        - name: server
          image: 730335441285.dkr.ecr.ap-southeast-1.amazonaws.com/online-boutique/shippingservice:6dbead2cda359b8d3b85d7628ddc28f7414bde57-30780838023
          ports:
            - containerPort: 50051
          env:
            - name: PORT
              value: "50051"
            - name: DISABLE_PROFILER
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
spec:
  selector:
    app: shippingservice
  ports:
    - port: 50051
      targetPort: 50051