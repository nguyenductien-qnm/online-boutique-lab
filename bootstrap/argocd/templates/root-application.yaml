{{- if .Values.rootApplication.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nguyenductien-qnm/online-boutique-lab.git
    targetRevision: main
    path: gitops/apps/chart
    helm:
      valueFiles:
        - values.yaml
        - values-images.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: online-boutique

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
