name: Build ARM64 images

run-name: Build ARM64 (${{ inputs.build_all && 'all services' || inputs.services }})

on:
  workflow_dispatch:
    inputs:
      build_all:
        description: Build all 12 services
        required: true
        default: false
        type: boolean
      services:
        description: "Comma-separated services, e.g. frontend,paymentservice"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Validate selection
        id: matrix
        env:
          BUILD_ALL: ${{ inputs.build_all }}
          REQUESTED_SERVICES: ${{ inputs.services }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch"
            exit 1
          fi

          catalog='[
            {"service":"adservice","context":"src/adservice"},
            {"service":"cartservice","context":"src/cartservice/src"},
            {"service":"checkoutservice","context":"src/checkoutservice"},
            {"service":"currencyservice","context":"src/currencyservice"},
            {"service":"emailservice","context":"src/emailservice"},
            {"service":"frontend","context":"src/frontend"},
            {"service":"loadgenerator","context":"src/loadgenerator"},
            {"service":"paymentservice","context":"src/paymentservice"},
            {"service":"productcatalogservice","context":"src/productcatalogservice"},
            {"service":"recommendationservice","context":"src/recommendationservice"},
            {"service":"shippingservice","context":"src/shippingservice"},
            {"service":"shoppingassistantservice","context":"src/shoppingassistantservice"}
          ]'

          allowed=$(jq -c '[.[].service]' <<<"$catalog")

          if [[ "$BUILD_ALL" == "true" ]]; then
            selected="$allowed"
          else
            selected=$(jq -cn --arg value "$REQUESTED_SERVICES" \
              '$value | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | unique')

            if [[ "$(jq length <<<"$selected")" -eq 0 ]]; then
              echo "::error::Select build_all or enter at least one service"
              exit 1
            fi

            invalid=$(jq -cn --argjson selected "$selected" --argjson allowed "$allowed" \
              '$selected - $allowed')

            if [[ "$(jq length <<<"$invalid")" -ne 0 ]]; then
              echo "::error::Unknown services: $(jq -r 'join(", ")' <<<"$invalid")"
              exit 1
            fi
          fi

          matrix=$(jq -cn --argjson catalog "$catalog" --argjson selected "$selected" \
            '{include: [$catalog[] | select(.service as $service | $selected | index($service))]}')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Selected services: $(jq -r 'join(", ")' <<<"$selected")"

  build:
    name: Build ${{ matrix.service }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}-${{ matrix.service }}
          allowed-account-ids: "730335441285"
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/arm64
          push: true
          pull: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/online-boutique/${{ matrix.service }}:${{ github.sha }}-${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true
